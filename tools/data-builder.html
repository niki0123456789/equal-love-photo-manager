<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>=LOVE データ更新ツール</title>
<link rel="stylesheet" href="./data-builder.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
<header><a href="../">← アプリへ戻る</a><div><b>=LOVE データ更新ツール</b><span>Excel・CSV・JSONを安全にevents.jsonへ変換</span></div></header>
<main>
<section class="hero">
  <h1>マスターデータ更新</h1>
  <p>ファイルを選択すると、現在のevents.jsonとの差分とデータ不備を確認します。元ファイルやアプリ内の所持データは変更しません。</p>
</section>
<section class="panel">
  <label class="upload-box" for="masterFile"><span>📄</span><b>Excel・ODS・CSV・JSONを選択</b><small>.xlsx / .xls / .ods / .csv / .json</small></label>
  <input id="masterFile" type="file" accept=".xlsx,.xls,.ods,.csv,.json,application/json">
  <div id="fileStatus" class="status">ファイルを選択してください。</div>
</section>
<section id="resultSection" class="hidden">
  <div id="summaryCards" class="summary-grid"></div>
  <section class="panel"><div class="section-head"><div><h2>検査結果</h2><p>エラーがある場合は生成できません。</p></div><span id="resultBadge"></span></div><div id="issueList"></div></section>
  <section class="panel"><div class="section-head"><div><h2>前回との差分</h2><p>追加・変更・削除予定を確認してください。</p></div></div><div id="diffList"></div></section>
  <section class="panel download-panel">
    <h2>更新ファイルを生成</h2>
    <p>確認後、events.json・config.json・差分レポートを生成できます。</p>
    <div class="download-actions">
      <button id="downloadEvents">events.json</button>
      <button id="downloadConfig">config.json</button>
      <button id="downloadZip" class="primary">更新用ZIP</button>
    </div>
  </section>
</section>
</main>
<script src="./data-builder.js"></script>
</body>
</html>
