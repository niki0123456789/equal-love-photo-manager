<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ef7fad">
<meta name="application-name" content="=LOVE 生写真管理">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="生写真管理">
<link rel="manifest" href="./manifest.webmanifest?v=1.0.0">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png?v=1.0.0">
<title>=LOVE 生写真管理</title>
<link rel="stylesheet" href="./css/style.css?v=1.0.0">
</head>
<body>
<section id="homeScreen" class="home">
<div class="wrap">
<div class="logo"><div class="eyebrow">=LOVE</div><h1>生写真管理</h1><p>メンバーを選択してください</p></div>
<div class="quick-grid">
<button class="quick" onclick="showPage('stats')"><span>📊</span>統計</button>
<button class="quick" onclick="showPage('wishlist')"><span>♡</span>欲しい一覧</button>
<button class="quick" onclick="showPage('trade')"><span>🔄</span>提供可能</button>
<button class="quick" onclick="showPage('missing')"><span>🔎</span>未所持一覧</button>
<button class="quick" onclick="showPage('oshi')"><span>👑</span>推し設定</button>
<button class="quick" onclick="showPage('backup')"><span>💾</span>バックアップ</button>
<button class="quick" onclick="showPage('help')"><span>📖</span>使い方</button>
<button class="quick" onclick="showPage('about')"><span>ℹ️</span>バージョン情報</button>
</div>
<div id="dataUpdateLabel" class="data-update-label">データ更新日：読み込み中</div>
<div id="memberGrid" class="member-grid"></div>
<div class="graduated-section">
  <div class="section-title"><span>卒業メンバー</span><small>卒業時点までの生写真を表示</small></div>
  <div id="graduatedMemberGrid" class="member-grid graduated-grid"></div>
</div>
</div>
</section>

<section id="managerScreen" class="hidden">
<header class="topbar"><div class="top-inner"><div class="top-row"><button id="backButton" class="back">← 戻る</button><div class="member-heading"><strong id="memberTitle"></strong><span id="memberSub"></span></div><div style="width:42px"></div></div>
<div id="managerTools"><div class="searchbox"><span>🔍</span><input id="searchInput" type="search" placeholder="年月・楽曲名・ツアー名・コラボ名で検索"></div>
<div class="filters">
<select id="categoryFilter"><option value="">すべてのカテゴリ</option><option value="通常">通常</option><option value="イベント">イベント</option><option value="コラボ">コラボ</option></select>
<select id="sortOrder"><option value="desc">新しい順</option><option value="new">NEW優先</option><option value="asc">古い順</option></select>
</div>
<div class="filters" id="ownershipFilterRow">
<select id="ownershipFilter">
<option value="">所持状況：すべて</option>
<option value="owned">所持ありのみ</option>
<option value="unowned">未所持のみ</option>
</select>
<select id="newFilter">
<option value="">新着：すべて</option>
<option value="new">NEWのみ</option>
</select>
<select id="oshiFilter">
<option value="">メンバー：すべて</option>
<option value="oshi">推しだけ表示</option>
</select>
</div>
</div></div></header>
<main class="wrap">
<section id="collectionPage">
<div class="summary"><div class="summary-card"><b id="ownedTotal">0</b><span>所持枚数</span></div><div class="summary-card"><b id="ownedTypes">0</b><span>所持種類</span></div><div class="summary-card"><b id="signedTotal">0</b><span>直筆あり</span></div></div>
<div class="notice">所持枚数・直筆・欲しい情報は、このブラウザ内に保存されます。</div><div id="eventList" class="event-list"></div>
</section>
<section id="statsPage" class="hidden"></section>
<section id="wishlistPage" class="hidden"></section>
<section id="tradePage" class="hidden"></section>
<section id="missingPage" class="hidden"></section>
<section id="oshiPage" class="hidden"></section>
<section id="backupPage" class="hidden"></section>
<section id="helpPage" class="hidden"></section>
<section id="aboutPage" class="hidden"></section>
</main>
<nav class="bottom-nav">
<button data-page="collection" class="active"><span>📚</span>一覧</button>
<button data-page="stats"><span>📊</span>統計</button>
<button data-page="wishlist"><span>♡</span>欲しい</button>
<button data-page="trade"><span>🔄</span>提供</button>
</nav>
</section>

<div id="updateBanner" class="update-banner hidden">
  <div><b>新しいバージョンがあります</b><span>最新版を反映するため再読み込みしてください。</span></div>
  <button id="applyUpdateButton">更新する</button>
</div>
<div id="offlineBanner" class="offline-banner hidden">オフラインで表示しています</div>
<div id="versionLabel" class="version-label">Ver 1.0.0</div>
<script src="./js/app.js?v=1.0.0-orderfix"></script>
<script>
(() => {
  const updateBanner = document.getElementById("updateBanner");
  const updateButton = document.getElementById("applyUpdateButton");
  const offlineBanner = document.getElementById("offlineBanner");

  const updateOnlineStatus = () => {
    offlineBanner.classList.toggle("hidden", navigator.onLine);
  };
  window.addEventListener("online", updateOnlineStatus);
  window.addEventListener("offline", updateOnlineStatus);
  updateOnlineStatus();

  if (!("serviceWorker" in navigator)) return;

  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (refreshing) return;
    refreshing = true;
    location.reload();
  });

  window.addEventListener("load", async () => {
    try {
      const registration = await navigator.serviceWorker.register("./service-worker.js?v=1.0.0-orderfix", {scope: "./"});
      const showUpdate = worker => {
        if (!worker) return;
        updateBanner.classList.remove("hidden");
        updateButton.onclick = () => worker.postMessage({type: "SKIP_WAITING"});
      };
      if (registration.waiting) showUpdate(registration.waiting);
      registration.addEventListener("updatefound", () => {
        const worker = registration.installing;
        worker?.addEventListener("statechange", () => {
          if (worker.state === "installed" && navigator.serviceWorker.controller) showUpdate(worker);
        });
      });
      registration.update();
    } catch (error) {
      console.error("Service Worker registration failed:", error);
    }
  });
})();
</script>
</body>
</html>
