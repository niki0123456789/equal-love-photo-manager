<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f06aa4">
<title>=LOVE 生写真管理</title>
<style>
:root{--accent:#f06aa4;--soft:#fff0f6;--bg:#f7f7fa;--card:#fff;--text:#26232a;--muted:#77737d;--border:#e9e6ec}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:var(--bg);color:var(--text);transition:background .25s ease}
button,input,select{font:inherit} .hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar-inner,main{width:min(100%,980px);margin:0 auto;padding:14px 16px}
.home{min-height:100vh;padding:28px 16px 40px;background:linear-gradient(180deg,#fff7fb 0%,#f8f7fb 100%)}
.home-inner{width:min(100%,760px);margin:0 auto}
.home h1{margin:8px 0 6px;text-align:center;font-size:28px}
.home p{margin:0 0 24px;text-align:center;color:var(--muted)}
.member-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.member-card{border:1px solid var(--border);border-radius:18px;padding:18px 14px;text-align:left;background:white;box-shadow:0 8px 24px rgba(38,20,31,.07);cursor:pointer;min-height:94px}
.member-card:active{transform:scale(.98)} .emoji{font-size:29px;display:block;margin-bottom:7px}
.name{font-weight:800;font-size:16px} .hint{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.member-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.member-title{font-size:20px;font-weight:800} .sub{font-size:12px;color:var(--muted);margin-top:3px}
.back-btn{border:1px solid var(--border);border-radius:10px;background:#fff;padding:8px 10px;cursor:pointer}
.controls{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:9px;margin-top:14px}
input,select{width:100%;min-height:42px;border:1px solid var(--border);border-radius:11px;padding:9px 11px;background:#fff;color:var(--text)}
.notice{margin:8px 0 16px;padding:11px 13px;border-radius:12px;background:#fff8dc;color:#635727;font-size:12px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;text-align:center}
.stat strong{display:block;font-size:19px} .stat span{font-size:11px;color:var(--muted)}
.event-list{display:grid;gap:12px;padding-bottom:40px}
.event{background:#fff;border:1px solid var(--border);border-radius:17px;overflow:hidden;box-shadow:0 8px 24px rgba(38,20,31,.07)}
.event-head{padding:15px 15px 12px;background:linear-gradient(135deg,var(--soft),#fff);border-bottom:1px solid var(--border)}
.event-title{font-size:17px;font-weight:800;line-height:1.35} .event-work{font-size:14px;font-weight:600;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px} .tag{border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:999px;padding:3px 8px;font-size:11px}
.member-name{padding:12px 15px 4px;font-weight:800;color:var(--accent)} .positions{padding:5px 15px 14px}
.position-row{min-height:48px;display:grid;grid-template-columns:1fr auto;align-items:center;border-bottom:1px solid #f0edf1}
.position-row:last-child{border-bottom:0} .counter{display:flex;align-items:center;gap:8px}
.counter button{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:20px;cursor:pointer}
.counter .plus{background:var(--accent);color:#fff;border-color:var(--accent)} .count{width:28px;text-align:center;font-weight:800}
.event-footer{padding:0 15px 14px;display:flex;justify-content:flex-end}
.official-link{display:inline-flex;align-items:center;min-height:36px;padding:7px 11px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-size:12px;font-weight:800}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media(max-width:640px){.controls{grid-template-columns:1fr 1fr}.controls .search{grid-column:1/-1}.topbar-inner,main{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<section id="homeScreen" class="home">
  <div class="home-inner">
    <h1>=LOVE 生写真管理</h1>
    <p>管理するメンバーを選択してください</p>
    <div id="memberGrid" class="member-grid"></div>
  </div>
</section>

<section id="managerScreen" class="hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="member-header">
        <div>
          <div id="selectedMemberTitle" class="member-title"></div>
          <div class="sub">生写真の所持枚数を管理</div>
        </div>
        <button id="backButton" class="back-btn" type="button">← メンバー選択</button>
      </div>
      <div class="controls">
        <input id="searchInput" class="search" type="search" placeholder="年月・衣装名・公式名称で検索">
        <select id="categoryFilter">
          <option value="">全カテゴリ</option><option value="通常">通常</option><option value="ライブ">ライブ</option><option value="コラボ">コラボ</option>
        </select>
        <select id="sortOrder"><option value="desc">新しい順</option><option value="asc">古い順</option></select>
      </div>
    </div>
  </header>
  <main>
    <div class="notice">所持枚数はこのブラウザ内に保存されます。端末変更やブラウザデータ削除では引き継がれません。</div>
    <section class="stats">
      <div class="stat"><strong id="ownedTotal">0</strong><span>所持枚数</span></div>
      <div class="stat"><strong id="ownedTypes">0</strong><span>所持種類</span></div>
      <div class="stat"><strong id="shownEvents">0</strong><span>表示イベント</span></div>
    </section>
    <section id="eventList" class="event-list"></section>
  </main>
</section>

function openMember(id){state.memberId=id;const m=MEMBERS.find(x=>x.id===id);applyTheme(m);selectedMemberTitle.textContent=`${m.emoji} ${m.name}`;homeScreen.classList.add("hidden");managerScreen.classList.remove("hidden");window.scrollTo(0,0);render()}
function goHome(){state.memberId=null;managerScreen.classList.add("hidden");homeScreen.classList.remove("hidden");document.body.style.background="";window.scrollTo(0,0)}
function esc(v){return String(v||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function filtered(){const q=state.search.trim().toLowerCase();return EVENTS.filter(e=>!state.category||e.category===state.category).filter(e=>!q||[e.period,e.work,e.officialName,e.id,e.category].join(" ").toLowerCase().includes(q)).sort((a,b)=>state.sort==="asc"?a.sort-b.sort:b.sort-a.sort)}
function stats(list){let total=0,types=0;EVENTS.forEach(e=>POSITIONS.forEach(p=>{const n=getCount(e.id,state.memberId,p.id);total+=n;if(n>0)types++}));ownedTotal.textContent=total;ownedTypes.textContent=types;shownEvents.textContent=list.length}
function render(){
 const m=MEMBERS.find(x=>x.id===state.memberId),list=filtered();stats(list);eventList.innerHTML="";
 if(!list.length){eventList.innerHTML='<div class="empty">該当するイベントがありません。</div>';return}
 const frag=document.createDocumentFragment();
 list.forEach(e=>{
  const card=document.createElement("article");card.className="event";
  const head=document.createElement("div");head.className="event-head";head.innerHTML=`<div class="event-title">${esc(e.period||e.officialName)}</div><div class="event-work">${esc(e.work)}</div><div class="meta"><span class="tag">${esc(e.category)}</span><span class="tag">#${e.sort}</span></div>`;card.appendChild(head);
  const mn=document.createElement("div");mn.className="member-name";mn.textContent=`${m.emoji} ${m.name}`;card.appendChild(mn);
  const ps=document.createElement("div");ps.className="positions";
  POSITIONS.forEach(p=>{
    const row=document.createElement("div");row.className="position-row";
    const label=document.createElement("span");label.textContent=p.name;
    const c=document.createElement("div");c.className="counter";
    const minus=document.createElement("button");minus.type="button";minus.textContent="−";
    const num=document.createElement("span");num.className="count";num.textContent=getCount(e.id,m.id,p.id);
    const plus=document.createElement("button");plus.type="button";plus.className="plus";plus.textContent="＋";
    minus.onclick=()=>{const n=Math.max(0,getCount(e.id,m.id,p.id)-1);setCount(e.id,m.id,p.id,n);num.textContent=n;stats(list)};
    plus.onclick=()=>{const n=getCount(e.id,m.id,p.id)+1;setCount(e.id,m.id,p.id,n);num.textContent=n;stats(list)};
    c.append(minus,num,plus);row.append(label,c);ps.appendChild(row);
  });
  card.appendChild(ps);
  if(e.officialUrl){const f=document.createElement("div");f.className="event-footer";const a=document.createElement("a");a.className="official-link";a.href=e.officialUrl;a.target="_blank";a.rel="noopener noreferrer";a.textContent="公式ページを見る";f.appendChild(a);card.appendChild(f)}
  frag.appendChild(card);
 });
 eventList.appendChild(frag);
}
MEMBERS.forEach(m=>{const b=document.createElement("button");b.type="button";b.className="member-card";b.style.background=`linear-gradient(135deg,${m.soft},#fff)`;b.innerHTML=`<span class="emoji">${m.emoji}</span><span class="name">${m.name}</span><span class="hint">タップして管理</span>`;b.onclick=()=>openMember(m.id);memberGrid.appendChild(b)});
backButton.onclick=goHome;categoryFilter.onchange=e=>{state.category=e.target.value;render()};sortOrder.onchange=e=>{state.sort=e.target.value;render()};searchInput.oninput=e=>{state.search=e.target.value;render()};
</script>
</body>
</html>
